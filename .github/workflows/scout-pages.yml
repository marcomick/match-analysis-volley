# Pubblica l'app dello scout (scout/) su GitHub Pages: https://marcomick.github.io/match-analysis-volley/
# Parte da sola a ogni push su main che tocca scout/ (o a mano da Actions → "Scout su GitHub Pages" → Run workflow).
# Si pubblicano solo i file dell'app e referti.json, non il resto della repo. La versione della cache del service
# worker (VERSION in sw.js) si calcola dal contenuto dei file: a ogni modifica l'iPad scarica la nuova versione.
# Una volta sola, da github.com: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Scout su GitHub Pages

on:
  push:
    branches: [main]
    paths: ["scout/**", ".github/workflows/scout-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scout-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara i file dell'app
        run: |
          mkdir site
          cp scout/index.html scout/manifest.json scout/sw.js scout/icon-180.png scout/icon-512.png site/
          [ -f scout/referti.json ] && cp scout/referti.json site/
          v="scout-$(cat site/* | sha256sum | cut -c1-10)"
          sed -i "s/const VERSION = '[^']*';/const VERSION = '$v';/" site/sw.js
          grep -q "const VERSION = '$v';" site/sw.js
          touch site/.nojekyll
          ls -la site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
