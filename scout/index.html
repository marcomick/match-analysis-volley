<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Scout a tocchi</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<!-- App dello scout da video a tocchi (mockup del 2026-11-18, app dal 2026-11-22). PWA: manifest.json, sw.js, icone.
     Lo scout in corso si salva a ogni tocco in IndexedDB (database "volley-scout") e si riprende dal pannello "Scout";
     la copia di sicurezza (JSON) contiene scout, tarature, partite, schieramenti e preferenze.
     Dati di partenza (se non si sceglie una partita): G4 Anguillara - Decimo, 1° set.
     Il sistema sa chi batte, chi è in campo, chi riceve (schieramento imparato per squadra e rotazione) e chi attacca (dalla sigla).
     I pulsanti di una squadra sono disposti come la si vede nel video (di spalle o di fronte alla telecamera).
     Non scrive ancora un .dvw: mostra i codici che scriverebbe. Video da file o da YouTube.
     Preferenze, tarature, partite e schieramenti imparati restano nel browser (localStorage). -->
<style>
  :root {
    --bg:#0f1117; --card:#1a1d27; --card2:#222634; --line:#2b2f3d; --text:#eef0f5; --muted:#9aa0b0;
    --noi:#3b82f6; --loro:#f97316; --ok:#22c55e; --bad:#ef4444; --warn:#facc15;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif; }
  body { -webkit-user-select:none; user-select:none; overflow:hidden; }
  button { font:inherit; color:inherit; border:0; cursor:pointer; background:var(--card2); border-radius:10px; touch-action:manipulation; }
  button:disabled { opacity:.25; cursor:default; }
  .app { display:grid; grid-template-columns:minmax(0,1fr) 330px; grid-template-rows:auto 1fr; height:100vh; height:100dvh; }   /* dvh: altezza visibile vera su iPad */
  .mock { grid-column:1/3; background:#161a26; color:var(--muted); font-size:12px; padding:5px 10px;
    border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; }
  .mock b { color:#fff; font-size:13px; }
  .mock .mb { background:var(--card2); border-radius:8px; padding:5px 11px; font-size:12px; color:var(--text); }
  .mock { min-width:0; overflow:hidden; } .mock .mb { white-space:nowrap; flex:0 0 auto; }
  #mockTitle { min-width:0; flex:0 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .savest { font-size:11px; color:var(--muted); white-space:nowrap; }
  .slist { display:flex; flex-direction:column; gap:6px; }
  .sitem { display:flex; gap:10px; align-items:center; background:var(--card2); border-radius:10px; padding:9px 10px; }
  .sitem.cur { outline:2px solid #3b5bdb; }
  .sitem .si { flex:1; min-width:0; } .sitem .st { font-weight:700; font-size:15px; }
  .sitem .sd { font-size:12px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sitem button { padding:10px 14px; font-size:14px; } .sitem .go { background:#3b5bdb; } .sitem .del { background:#3e1c1c; }
  .bigb { padding:12px 16px; font-size:15px; }
  .left { display:flex; flex-direction:column; min-height:0; min-width:0; padding:8px; gap:8px; }
  .right { border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }

  /* barra punteggio */
  .bar { display:flex; align-items:center; gap:7px; }
  .score { display:flex; align-items:center; gap:9px; font-size:22px; font-weight:700; }
  .tm { padding:3px 10px; border-radius:8px; font-size:15px; font-weight:700; }
  .tm.noi { background:var(--noi); } .tm.loro { background:var(--loro); }
  .rot { font-size:12px; color:var(--muted); font-weight:500; }
  .srv { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--warn); }
  .grow { flex:1; }
  .ctl { padding:8px 10px; font-size:14px; white-space:nowrap; }
  .score { white-space:nowrap; min-width:0; flex:0 1 auto; }
  /* nomi lunghi (es. Valsugana Panizzo, Top Five Tarquinia): si accorciano, la riga non esce dallo schermo */
  .bar { min-width:0; } .bar .ctl { flex:0 0 auto; }
  .score .tm { min-width:0; max-width:11em; overflow:hidden; text-overflow:ellipsis; flex:0 1 auto; }
  .ctl.on { background:#3d4560; outline:2px solid #6b7aa8; }
  /* iPad da 11" (1180-1194 px in orizzontale): la riga dei comandi deve stare nella colonna del video */
  @media (max-width:1250px) { .bar { gap:5px; } .ctl { padding:8px 7px; font-size:13px; } #play { min-width:70px !important; }
    .score { font-size:20px; gap:6px; } .score .tm { max-width:8.5em; font-size:14px; } }

  /* video */
  .vwrap { position:relative; background:#000; border-radius:10px; overflow:hidden; flex:1 1 auto; min-height:180px; touch-action:none; }
  html, body { overscroll-behavior:none; }   /* il primo tocco sul video non deve far scorrere la pagina (il tocco andava perso) */
  video { width:100%; height:100%; object-fit:contain; display:block; pointer-events:none; }
  .vmsg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted);
    font-size:15px; text-align:center; padding:20px; pointer-events:none; }
  /* tutto schermo: il riquadro del video copre la pagina, i comandi stanno nella fascia in alto */
  .fsbar { display:none; position:absolute; top:0; left:0; right:0; z-index:5; gap:5px; align-items:center; padding:5px 6px;
    background:rgba(8,10,18,.82); flex-wrap:wrap; }
  .app.fs .fsbar { display:flex; }
  .app.fs .vwrap { position:fixed; inset:0; z-index:80; border-radius:0; }
  .fsbar button { padding:7px 9px; font-size:13px; background:rgba(40,46,62,.95); }
  .fsbar button.sel { outline:2px solid var(--warn); background:#3b3720; }
  .fsbar button.imp { outline:2px dashed #8b96bf; }
  .fsbar .fsc { font-weight:700; font-size:14px; margin-right:4px; white-space:nowrap; }
  .fsbar .sep { width:8px; }
  .app.fs .ohead, .app.fs .side, .app.fs .pausebadge, .app.fs .calmini, .app.fs .calpanel { top:var(--fsh, 50px); }
  .pbl { font-size:12px; font-weight:500; color:#d6d9e2; margin:4px 0; max-height:30vh; overflow:auto; }
  .pausebadge { position:absolute; top:10px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.7); padding:6px 12px; border-radius:8px;
    font-size:14px; font-weight:600; pointer-events:none; }
  .side { position:absolute; top:10px; padding:3px 8px; border-radius:6px; font-size:12px; font-weight:700; pointer-events:none; opacity:.85; }
  .seekflash { position:absolute; top:0; bottom:0; width:38%; display:flex; align-items:center; justify-content:center;
    font-size:26px; font-weight:800; background:rgba(255,255,255,.12); opacity:0; transition:opacity .35s; pointer-events:none; }
  .seekflash.l { left:0; border-radius:0 50% 50% 0; } .seekflash.r { right:0; border-radius:50% 0 0 50%; }
  .seekflash.show { opacity:1; transition:none; }

  /* pannello di input */
  .input { background:var(--card); border-radius:12px; padding:8px; display:flex; flex-direction:column; gap:7px; flex:0 0 auto; }
  .prompt { font-size:15px; display:flex; align-items:center; gap:8px; min-height:26px; }
  .prompt .who { font-weight:700; }
  .hint { color:var(--muted); font-size:13px; }
  .switch { margin-left:auto; padding:6px 10px; font-size:13px; }
  .zone { min-height:150px; display:flex; flex-direction:column; gap:6px; }
  .row { display:grid; gap:6px; }
  .pbtn { min-height:54px; padding:4px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:15px; font-weight:600; line-height:1.15; }
  .pbtn small { font-size:11px; color:var(--muted); font-weight:500; }
  .pbtn.sel { outline:3px solid var(--warn); background:#3b3720; }
  .pbtn.empty { visibility:hidden; }
  .lab { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .chips { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .chip { padding:7px 11px; font-size:13px; }
  .chip.sel { outline:2px solid var(--warn); background:#3b3720; }
  .noi-t .pbtn:not(.empty) { border-bottom:3px solid var(--noi); }
  .loro-t .pbtn:not(.empty) { border-bottom:3px solid var(--loro); }
  .netline { height:0; border-top:2px dashed #555c70; margin:2px 0; }

  /* voti: sempre nello stesso posto */
  .grades { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
  .g { min-height:62px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:26px; font-weight:800; }
  .g small { font-size:11px; font-weight:500; color:var(--muted); margin-top:1px; }
  .g.pos { background:#173a26; } .g.neg { background:#3e1c1c; } .g.mid { background:var(--card2); }

  /* base del centrale: sempre nello stesso posto */
  .basebox { padding:8px 10px 10px; border-bottom:1px solid var(--line); background:#161a26; }
  .basebox .bh { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .basebox .bt { font-size:11px; color:var(--muted); }
  .bbtns { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .bb { min-height:60px; font-size:21px; font-weight:800; background:#2a3045; }
  .bb.sel { outline:3px solid var(--warn); background:#3b3720; }
  .bb.imp { outline:2px dashed #8b96bf; }

  /* colonna destra */
  .stats { padding:8px 10px; border-bottom:1px solid var(--line); font-size:12px; color:var(--muted);
    display:grid; grid-template-columns:1fr 1fr; gap:3px 10px; }
  .stats b { color:var(--text); font-size:15px; }
  .log { flex:1; overflow-y:auto; padding:6px 10px; font-size:13px; }
  .rally { border-bottom:1px solid var(--line); padding:6px 0; }
  .rally.cur { background:#1b2030; margin:0 -10px; padding:6px 10px; }
  .rh { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-bottom:2px; }
  .act { display:flex; gap:8px; align-items:baseline; }
  .act code { font-family:Menlo,monospace; font-size:12px; min-width:92px; }
  .act .d { color:var(--muted); font-size:12px; }
  .act.auto code { color:#9aa0b0; }
  .tools { padding:8px; border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  #corrBtn { grid-column:2/4; }
  .crow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--card2); border-radius:10px; padding:8px 10px; }
  .crow { flex-wrap:nowrap; } .crow .cn { min-width:110px; font-weight:700; } .crow button { padding:10px 14px; font-size:15px; background:#2d3346; }
  .crow .cv { min-width:44px; text-align:center; font-size:18px; font-weight:800; } .crow .cd { color:var(--muted); font-size:12px; }
  .tools button { padding:9px 6px; font-size:13px; }

  .toast { position:fixed; left:50%; top:60px; transform:translateX(-50%); background:#5b1a1a; padding:10px 16px;
    border-radius:10px; font-size:15px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:300; }
  .toast.show { opacity:1; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; z-index:90; }
  .modal .box { background:var(--card); border-radius:14px; padding:16px; width:min(720px,94vw); display:flex; flex-direction:column; gap:10px; max-height:94vh; overflow-y:auto; }
  .modal h3 { margin:0; font-size:17px; }
  .hidden { display:none !important; }

  /* sigle sul video (dopo la taratura del campo) */
  .ovl { position:absolute; inset:0; pointer-events:none; }
  #ytbox, #ytcap { position:absolute; inset:0; } #ytbox iframe { width:100%; height:100%; border:0; display:block; }
  .ovl > svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .ob { position:absolute; pointer-events:auto; background:rgba(8,10,18,.42); border:0; color:#fff; border-radius:8px;
    padding:calc(5px*var(--obs,1.3)) calc(8px*var(--obs,1.3)); min-width:calc(42px*var(--obs,1.3)); font-size:calc(15px*var(--obs,1.3));
    font-weight:800; line-height:1.05; text-align:center; text-shadow:0 1px 2px #000; white-space:nowrap; }
  .ob::before { content:''; position:absolute; inset:-8px; }      /* area di tocco più larga del disegno */
  .ob.noi { box-shadow:inset 0 -3px 0 var(--noi); } .ob.loro { box-shadow:inset 0 -3px 0 var(--loro); }
  .ob small { display:block; font-size:calc(10px*var(--obs,1.3)); font-weight:600; opacity:.9; }
  .ob.sm { font-size:calc(12px*var(--obs,1.3)); opacity:.85; }
  .ob.prop { background:rgba(8,10,18,.6); outline:1px dashed rgba(255,255,255,.55); }
  .pip { position:absolute; z-index:28; width:calc(var(--pipw, 30) * 1%); aspect-ratio:16/9; background:#000; border:2px solid rgba(255,255,255,.7);
    border-radius:8px; overflow:hidden; box-shadow:0 4px 14px rgba(0,0,0,.6); }
  .pip.c0 { left:8px; top:44px; } .pip.c1 { right:8px; top:44px; }
  .app.fs .pip.c0, .app.fs .pip.c1 { top:calc(var(--fsh, 50px) + 34px); } .pip.c2 { left:8px; bottom:52px; } .pip.c3 { right:8px; bottom:52px; }
  .pip video, .pip #pipYt, .pip iframe { width:100%; height:100%; display:block; border:0; pointer-events:none; object-fit:contain; }
  .piplab { position:absolute; left:6px; top:4px; font-size:13px; font-weight:800; color:#fff; background:rgba(0,0,0,.6); padding:1px 6px; border-radius:6px; }
  .subban { position:absolute; left:50%; top:48px; transform:translateX(-50%); z-index:30; background:rgba(20,24,36,.92);
    border:2px solid var(--warn); border-radius:12px; padding:8px 12px; display:flex; gap:10px; align-items:center; font-size:15px; max-width:92%; }
  .subban button { padding:9px 14px; font-size:15px; border-radius:8px; border:0; background:#2a3040; color:#fff; }
  .subban button.go { background:#3b5bdb; }
  .ob.sel { background:rgba(250,204,21,.85); color:#111; text-shadow:none; }
  .ob:disabled { opacity:.18; }
  .ob.blk { font-size:calc(12px*var(--obs,1.3)); min-width:calc(30px*var(--obs,1.3)); padding:calc(2px*var(--obs,1.3)) calc(5px*var(--obs,1.3)); }
  .ob.blk small { font-size:calc(8px*var(--obs,1.3)); }
  .ob.dz { font-size:calc(19px*var(--obs,1.3)); min-width:calc(50px*var(--obs,1.3)); padding:calc(8px*var(--obs,1.3)) calc(11px*var(--obs,1.3)); }
  .ob.ghost { pointer-events:none; background:rgba(8,10,18,.25); opacity:.85; }   /* solo indicazione: si tocca il giocatore */
  .ohead { position:absolute; top:8px; left:8px; background:rgba(8,10,18,.6); padding:5px 9px; border-radius:8px;
    font-size:13px; font-weight:600; max-width:55%; }
  .ohead .tm { font-size:12px; padding:1px 6px; margin-right:5px; }
  .opills { position:absolute; left:8px; bottom:8px; display:flex; gap:6px; flex-wrap:wrap; max-width:80%; pointer-events:none; }
  .opill { pointer-events:auto; background:rgba(8,10,18,.65); color:#fff; padding:8px 11px; font-size:13px; border-radius:8px; }
  .opill.pos { background:rgba(21,128,61,.8); } .opill.neg { background:rgba(185,28,28,.75); }
  .opop button.g2 small { display:block; font-size:9px; font-weight:500; opacity:.8; }
  .opop { position:absolute; pointer-events:auto; display:flex; gap:4px; background:rgba(10,12,20,.65); padding:4px;
    border-radius:10px; transform:translateX(-50%); }
  .opop button { min-width:44px; height:44px; font-size:20px; font-weight:800; background:rgba(40,46,62,.9); color:#fff; padding:0 6px; }
  .opop button.tip { font-size:12px; font-weight:700; }
  .opop button.tip.sel { outline:2px solid var(--warn); background:rgba(90,80,20,.95); }
  /* "rigore": quattro esiti (punto, difeso, fuori/rete, invasione) prima dei voti della palla libera */
  .opop .rgrow { display:flex; gap:4px; align-items:center; padding-right:6px; margin-right:2px; border-right:1px solid rgba(255,255,255,.3); }
  .opop .rgrow span { font-size:11px; font-weight:700; opacity:.85; }
  .opop button.rg.pos, .chip.rg.pos { background:rgba(21,128,61,.9); } .opop button.rg.neg, .chip.rg.neg { background:rgba(185,28,28,.8); }
  .app.vonly .input { display:none; }
  /* lontano dal bordo basso dello schermo: lì Safari prende il tocco per mostrare la sua barra */
  .app.fs .opills, .app.vonly .opills { bottom:38px; }
  /* finestre aperte (impostazioni, cambio, schieramento...): i comandi sul video spariscono, non ci finiscono sopra */
  .modal { z-index:300 !important; }
  body:has(.modal:not(.hidden)) .ovl, body:has(.modal:not(.hidden)) .pip, body:has(.modal:not(.hidden)) .subban { visibility:hidden; }
  .tapring { position:absolute; width:46px; height:46px; margin:-23px 0 0 -23px; border:3px solid var(--warn); border-radius:50%; pointer-events:none; animation:tapr .45s ease-out forwards; z-index:25; }
  @keyframes tapr { from { opacity:1; transform:scale(.5); } to { opacity:0; transform:scale(1.3); } }
  .calpt { position:absolute; width:20px; height:20px; margin:-10px 0 0 -10px; border:2px solid var(--warn); border-radius:50%; }
  .calpanel { position:absolute; top:8px; right:8px; width:min(470px, calc(100% - 16px)); max-height:calc(100% - 16px); overflow:auto;
    background:rgba(10,12,20,.9); border-radius:12px; padding:8px; flex-direction:row !important; align-items:center !important;
    pointer-events:auto; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:13px; line-height:1.35; }
  .calpanel .calside { display:flex; flex-direction:column; gap:6px; flex:1; min-width:0; }
  .calpanel .calmsg { text-align:left; } .calpanel .chips { justify-content:flex-start !important; }
  .calpanel svg { flex:0 0 auto; touch-action:none; }
  .calmini { position:absolute; top:6px; left:50%; transform:translateX(-50%); background:rgba(10,12,20,.85); padding:5px 10px;
    border-radius:8px; font-size:13px; pointer-events:auto; display:flex; gap:8px; align-items:center; white-space:nowrap; }
  .calmini b { color:var(--warn); } .calmini button { padding:5px 9px; font-size:12px; } .calpanel .chips { justify-content:center; }
  .calpanel button { padding:8px 10px; font-size:13px; }
  .calpt.bad { border-color:#ef4444; }
  .calid { position:absolute; transform:translate(8px,-20px); font-size:11px; font-weight:700; color:var(--warn); text-shadow:0 1px 2px #000; pointer-events:none; }
  .calbar { position:absolute; left:50%; bottom:12px; transform:translateX(-50%); background:rgba(0,0,0,.85); padding:8px 12px;
    border-radius:10px; font-size:14px; pointer-events:auto; display:flex; gap:8px; align-items:center; max-width:94%; }
  .calbar b { color:var(--warn); }
  .calbar button { padding:8px 12px; font-size:13px; }
  .ovlhint { position:absolute; left:50%; top:46px; transform:translateX(-50%); background:rgba(0,0,0,.7); padding:6px 10px;
    border-radius:8px; font-size:13px; color:var(--muted); }

  /* schieramento a trascinamento */
  .pool { display:flex; gap:6px; flex-wrap:wrap; min-height:52px; padding:6px; background:#141722; border-radius:10px; }
  .dchip { padding:8px 10px; border-radius:9px; background:#2d3346; font-weight:600; font-size:14px; touch-action:none; cursor:grab;
    display:flex; flex-direction:column; align-items:center; line-height:1.15; }
  .dchip small { font-size:11px; color:var(--muted); font-weight:500; }
  .dchip.sel { outline:3px solid var(--warn); }
  .dchip.used { opacity:.35; }
  .ghost { position:fixed; z-index:400; pointer-events:none; opacity:.9; transform:translate(-50%,-50%) scale(1.08); box-shadow:0 8px 20px rgba(0,0,0,.5); }
  .slots { display:grid; gap:8px; }
  .slot { min-height:66px; border:2px dashed #4a5168; border-radius:12px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:4px; padding:4px; }
  .slot .sl { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .slot.over { border-color:var(--warn); background:#2a2816; }

  /* tutorial */
  .tut-block { position:fixed; inset:0; z-index:200; }
  .tut-hole { position:fixed; border-radius:12px; box-shadow:0 0 0 9999px rgba(0,0,0,.72); outline:3px solid var(--warn);
    z-index:201; pointer-events:none; transition:all .25s; }
  .tut-card { position:fixed; z-index:202; width:min(460px,92vw); background:#1f2433; border:1px solid #3d4560;
    border-radius:14px; padding:14px 16px; font-size:15px; line-height:1.45; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  .tut-card h3 { margin:0 0 6px; font-size:16px; color:var(--warn); }
  .tut-card p { margin:0 0 6px; }
  .tut-card code { font-family:Menlo,monospace; font-size:13px; background:#2b3142; padding:1px 5px; border-radius:5px; }

<script>
// ---------------------------------------------------------------- dati (dal .dvw di G4)
let DATA = {"*": {"name": "Anguillara", "players": [{"n": 2, "c": "Imundi", "r": "C2", "sv": "M"}, {"n": 8, "c": "Mondati", "r": "C", "sv": "M"}, {"n": 11, "c": "Dolci", "r": "L", "sv": null}, {"n": 13, "c": "Rossi", "r": "M2", "sv": "M"}, {"n": 15, "c": "Lupi", "r": "C", "sv": "M"}, {"n": 19, "c": "Marasca", "r": null, "sv": "H"}, {"n": 24, "c": "Leva", "r": null, "sv": null}, {"n": 48, "c": "Sica", "r": null, "sv": null}, {"n": 50, "c": "D'Isidoro", "r": "P", "sv": "M"}, {"n": 71, "c": "Cilio", "r": "C1", "sv": "M"}, {"n": 72, "c": "Grussu", "r": "M", "sv": "M"}, {"n": 73, "c": "Capparella", "r": "M1", "sv": "M"}, {"n": 74, "c": "Fanton", "r": "O", "sv": "M"}], "lineup": [50, 73, 2, 74, 13, 71]},
              "a": {"name": "Decimo", "players": [{"n": 1, "c": "Licenziati", "r": null, "sv": null}, {"n": 2, "c": "D'Elia", "r": "O", "sv": "M"}, {"n": 3, "c": "Liberatori", "r": null, "sv": null}, {"n": 4, "c": "Chimenton", "r": "M1", "sv": "M"}, {"n": 10, "c": "Racheli", "r": "P", "sv": "M"}, {"n": 11, "c": "Cepparano", "r": null, "sv": "M"}, {"n": 13, "c": "Pessei", "r": "C2", "sv": "M"}, {"n": 14, "c": "Caranzetti", "r": "P", "sv": "M"}, {"n": 18, "c": "Carrer", "r": "C1", "sv": "Q"}, {"n": 19, "c": "Terribili", "r": null, "sv": null}, {"n": 22, "c": "D'Arienzo", "r": "O", "sv": "M"}, {"n": 30, "c": "Moscetta", "r": "C", "sv": "M"}, {"n": 31, "c": "Pedico", "r": "L", "sv": null}, {"n": 40, "c": "Colletti", "r": null, "sv": null}, {"n": 66, "c": "Sardella", "r": "M2", "sv": "M"}], "lineup": [13, 22, 66, 18, 14, 4]}};
let FIRST_SERVE = '*';             // nel 1° set batte per prima Anguillara
let OUR = 'a';                     // Decimo = squadra "a" (ospite) nel file
const G4_MATCH = {data:JSON.parse(JSON.stringify(DATA)), first:'*', our:'a', title:'G4 Anguillara - Decimo, 1° set'};
const other = t => t === '*' ? 'a' : '*';
const SERVE_TYPES = [['M','Salto float'],['Q','Salto spin'],['H','Float a terra']];
// voto della ricezione -> voto della battuta (su tutti i .dvw 2026-2027 l'abbinamento è sempre questo)
const SERVE_FROM_REC = {'#':'-','+':'-','!':'!','-':'+','/':'/','=':'#'};
// sigle: [sigla, chi attacca, tipo di palla nel .dvw, chiamata implicita]
// A4 = chi attacca in posto 4, A3 = centrale, A2 = posto 2, AP = pipe (dallo schieramento)
// niente XC (indicazione dell'utente: si può non segnare e complica tutto); per il centrale X1, X2, X7
const COMBOS_FRONT = [['V5','A4','H'],['X5','A4','T'],['X7','A3','Q','K7'],['X1','A3','Q','K1'],['X2','A3','Q','K2'],['X6','A2','T'],['V6','A2','H']];
const COMBOS_BACK  = [['P2','P','O'],null,null,['XP','AP','T'],null,['X8','OB','T'],['V8','OB','H']];
const ALL_COMBOS = [...COMBOS_FRONT, ...COMBOS_BACK].filter(Boolean);
const CALLS = ['K1','KC','K7','K2'];
const GRADE_TEXT = {
  serve:{'#':'ace','=':'errore'},
  R:{'#':'perfetta','+':'positiva','!':'no 1° tempo','-':'palla alta','/':'di là','=':'ace subito'},
  A:{'#':'punto','+':'difesa loro scarsa','!':'coperto','-':'difeso','/':'murato','=':'errore'},
  B:{'#':'punto','+':'buono per noi','!':'ripreso','-':'buono per loro','/':'invasione','=':'mani fuori'},
  D:{'#':'perfetta','+':'buona','!':'rigiocabile','-':'scarsa','/':'di là','=':'errore'},
  none:{},
};
const GRADES = ['#','+','!','-','/','='];

// ---------------------------------------------------------------- preferenze e schieramenti imparati
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let PREFS = Object.assign({comboMirror:'auto', pip:true, pipDelay:3, pipCorner:3, pipSize:30, tapPlayers:true, comboLayout:'griglia', neutralHow:false, obScale:1.3, step:5, near:'*', autopause:true, overlay:true, videoOnly:false, oppLight:true}, load('scoutMockupPrefs') || {});
let ARR = load('scoutMockupArr') || {};      // {nome squadra: {rotazione: {rec:[3 gettoni], att:{A4,A3,A2,AP}}}}
const savePrefs = () => save('scoutMockupPrefs', PREFS);
// squadra di spalle alla telecamera nel set in corso (S.near): cambia campo a ogni set, al 5° si sceglie e si cambia
// sull'8 (richiesta dell'utente del 2026-11-22); PREFS.near resta solo come valore di partenza
const nearT = () => (S && S.near) || PREFS.near;
const isFar = t => t !== nearT();           // squadra di fronte alla telecamera: tutto a specchio

// ---------------------------------------------------------------- stato
let S, history = [], future = [], taps = 0, firstTapAt = null, videoAtFirstTap = null, askedArr = {};
// video aperto ({kind:'file', name, size} | {kind:'yt', url} | {kind:'url', src}), chiave dello scout salvato, ripresa in attesa
let VSRC = null, CUR_MATCH = null, SCOUT_KEY = null, resumeWanted = null, pendingSeek = null, saveTimer = null, backupText = null;
function freshState() {
  const roles = {'*':{}, 'a':{}};
  for (const t of ['*','a']) for (const p of DATA[t].players) roles[t][p.n] = p.r;
  return { score:{'*':0,'a':0}, serving:FIRST_SERVE, pos:{'*':[...DATA['*'].lineup], 'a':[...DATA.a.lineup]},
           roles, serveType:{}, rally:[], rallyBase:null, rallies:[], phase:{k:'serve'}, sel:{}, nActs:0, nAuto:0, subsDone:{},
           setNo:(CUR_MATCH && CUR_MATCH.ref && CUR_MATCH.ref.set) || 1, sets:[] };
}
S = freshState();
const clone = o => JSON.parse(JSON.stringify(o));
const pl = (t,n) => DATA[t].players.find(p => p.n === n) || {n, c:'#'+n, r:null};
const role = (t,n) => (n == null ? '' : S.roles[t][n]) || '';
const name = (t,n) => n == null ? '?' : pl(t,n).c;
// libero in campo: scelto nel Cambio, altrimenti il primo usato nel set secondo il referto, altrimenti il primo L della rosa
const liberi = t => [...new Set([...(DATA[t].liberi || []), ...DATA[t].players.filter(p => p.r === 'L').map(p => p.n)])];
const libero = t => (S && S.libero && S.libero[t] != null) ? S.libero[t] : liberi(t)[0];

// posizioni dopo lo scambio di posto: prima linea posto 4 (M) · 3 (C) · 2 (O o P); dietro 5 (L) · 6 (M) · 1 (P o O)
function layout(t) {
  const pos = S.pos[t], z = {};
  const front = [pos[1],pos[2],pos[3]], back = [pos[0],pos[4],pos[5]];
  const take = (arr, test) => { const i = arr.findIndex(n => n != null && test(role(t,n))); return i < 0 ? null : arr.splice(i,1)[0]; };
  z[4] = take(front, r => r.startsWith('M')); z[3] = take(front, r => r.startsWith('C')); z[2] = take(front, r => r === 'O' || r === 'P');
  for (const k of [4,3,2]) if (z[k] == null) z[k] = front.shift() ?? null;
  // il centrale di seconda linea esce per il libero, tranne quando batte
  const L = libero(t), serverNum = S.serving === t ? pos[0] : null;
  // il libero entra per i giocatori indicati dal referto (di solito i centrali e chi li sostituisce), altrimenti per il centrale
  const lf = DATA[t].libFor, forLib = n => lf && lf.length ? lf.includes(n) : role(t,n).startsWith('C');
  const bb = back.map(n => (L && forLib(n) && n !== serverNum) ? L : n);
  z[1] = take(bb, r => r === 'O' || r === 'P'); z[6] = take(bb, r => r.startsWith('M')); z[5] = take(bb, r => r === 'L' || r.startsWith('C'));
  for (const k of [1,6,5]) if (z[k] == null) z[k] = bb.shift() ?? null;
  return z;
}
const onCourt = t => Object.values(layout(t)).filter(n => n != null);
// ---- tocco sul giocatore in ricezione: si tocca il giocatore nel video (dove lo si vede), non un pulsante.
// Dal punto toccato al campo con la taratura (correggendo l'altezza: si tocca il busto, circa 1 m sopra i piedi),
// poi il giocatore più vicino tra quelli dello schieramento di ricezione (contano soprattutto sinistra-destra).
function receptionTargets(rt) {
  const rec = arrangement(rt).rec, out = [], X = xs => isFar(rt) ? 9 - xs : xs, Y = d => isFar(rt) ? 9 + d : 9 - d;
  const zs = [5, 6, 1];
  rec.forEach((n, i) => { if (n != null) out.push({n, c:[X(ZX[zs[i]]), Y(6.2)]}); });
  onCourt(rt).filter(n => !rec.includes(n)).forEach((n, i) => out.push({n, c:[X(ZX[[4,3,2][i]] ?? 4.5), Y(2.6)], front:true}));
  return out;
}
function tapReceiver(e) {
  if (!PREFS.overlay || PREFS.tapPlayers === false || S.phase.k !== 'serve' || calMode) return false;
  const g = geomFrom(CALS[videoKey()]); if (!g || !g.toCourt) return false;
  const r = $('vwrap').getBoundingClientRect(), vr = videoRect();
  // tocco su un numero: vale quel giocatore (i numeri grandi possono essere spostati rispetto al giocatore)
  const hit = [...document.querySelectorAll('#ovl .ob.ghost')].find(el => { const q = el.getBoundingClientRect();
    return e.clientX >= q.left - 6 && e.clientX <= q.right + 6 && e.clientY >= q.top - 6 && e.clientY <= q.bottom + 6; });
  if (hit) { tap(); S.sel.receiver = Number(hit.dataset.v); render(); return true; }
  let p = [(e.clientX - r.left - vr.x) / vr.w, (e.clientY - r.top - vr.y) / vr.h];
  const c0 = g.toCourt(p); if (!isFinite(c0[0]) || !isFinite(c0[1])) return false;
  // 1 m in verticale in quel punto: dalla rete (2,43 m) nella stessa colonna, riportata alla scala del punto
  const xc = Math.min(Math.max(c0[0], 0), 9), f9 = g.floor(xc, 9), nt = g.netTop(xc);
  const sc = (a, b) => Math.hypot((a[0]-b[0]) * vAsp(), a[1]-b[1]);
  const yy = Math.min(Math.max(c0[1], -3), 21), s = sc(g.floor(xc + 0.5, yy), g.floor(xc - 0.5, yy)) / (sc(g.floor(xc + 0.5, 9), g.floor(xc - 0.5, 9)) || 1);
  p = [p[0] - (nt[0] - f9[0]) / 2.43 * s, p[1] - (nt[1] - f9[1]) / 2.43 * s];
  const c = g.toCourt(p), rt = other(S.serving), depth = isFar(rt) ? c[1] - 9 : 9 - c[1];
  if (!(depth > -0.3 && depth < 12 && c[0] > -3 && c[0] < 12)) return false;      // fuori dalla metà di chi riceve
  let best = null, bd = Infinity;
  for (const tg of receptionTargets(rt)) { const d = Math.hypot(c[0] - tg.c[0], 0.5 * (c[1] - tg.c[1])) + (tg.front ? 0.8 : 0);
    if (d < bd) { bd = d; best = tg; } }
  if (!best) return false;
  tap(); S.sel.receiver = best.n; render();
  const ring = document.createElement('div'); ring.className = 'tapring';
  ring.style.left = (e.clientX - r.left) + 'px'; ring.style.top = (e.clientY - r.top) + 'px';
  $('vwrap').appendChild(ring); setTimeout(() => ring.remove(), 500);
  return true;
}
const setterZone = t => { const i = S.pos[t].findIndex(n => role(t,n) === 'P'); return i < 0 ? 1 : i + 1; };

// schieramento di ricezione e di attacco dopo ricezione, per squadra e rotazione
function defaultArr(t) {
  const z = layout(t), rot = setterZone(t), fM = z[4], bM = z[6], L = onCourt(t).includes(libero(t)) ? libero(t) : z[5];
  const att = {A4:z[4], A3:z[3], A2: role(t,z[2]) === 'P' ? null : z[2], AP:z[6]};
  let rec;
  if (rot === 1) {
    if (t === OUR) rec = [bM, fM, L];                       // Decimo P1 "invertita": L in 1, M1 in 6 (attacca in 4), M2 in 5
    else { rec = [bM, L, fM]; att.A4 = z[2]; att.A2 = z[4]; } // altri: L in 6, M1 in 1 (attacca in 2), l'opposto in 4
  } else rec = {2:[fM,bM,L], 3:[fM,L,bM], 4:[fM,bM,L], 5:[fM,bM,L], 6:[fM,L,bM]}[rot];
  return {rec, att};
}
// gettone = ruolo se in campo c'è un solo giocatore con quel ruolo (regge ai cambi), altrimenti il numero
function tokenOf(t, n) { if (n == null) return null; const r = role(t,n);
  return r && onCourt(t).filter(x => role(t,x) === r).length === 1 ? r : '#' + n; }
function numOf(t, tok) { if (tok == null) return null; const onc = onCourt(t);
  if (tok[0] === '#') { const n = Number(tok.slice(1)); return onc.includes(n) ? n : null; }
  return onc.find(n => role(t,n) === tok) ?? null; }
function arrKey(t) { return [DATA[t].name, setterZone(t)]; }
function arrangement(t) {
  const d = defaultArr(t), [nm, rot] = arrKey(t), saved = ARR[nm]?.[rot];
  if (!saved) return {...d, learned:false};
  const rec = saved.rec.map((tok,i) => numOf(t,tok) ?? d.rec[i]);
  const att = {}; for (const k of ['A4','A3','A2','AP']) att[k] = saved.att[k] === null ? null : (numOf(t, saved.att[k]) ?? d.att[k]);
  return {rec, att, learned:true};
}
function saveArr(t, rec, att) {
  const [nm, rot] = arrKey(t); ARR[nm] = ARR[nm] || {};
  const a = {}; for (const k in att) a[k] = tokenOf(t, att[k]);
  ARR[nm][rot] = {rec: rec.map(n => tokenOf(t,n)), att:a}; save('scoutMockupArr', ARR);
}

// La squadra che riceve tiene il suo schieramento per tutto lo scambio (es. P1 "normale": opposto in 4, M1 in 2,
// anche in contrattacco, a muro e in difesa); la squadra che batte gioca con la disposizione usuale.
const receivingNow = t => t !== S.serving;
function baseRally(t) {
  const z = layout(t);
  if (!receivingNow(t)) return z;
  const att = arrangement(t).att, front = [z[4], z[3], z[2]], want = [att.A4, att.A3, att.A2];
  if (!want.every(n => n == null || front.includes(n))) return z;   // schieramento con giocatori fuori dalla prima linea: lascia com'è
  const rest = front.filter(n => !want.includes(n)), out = want.map(n => n ?? rest.shift() ?? null);
  return {...z, 4:out[0], 3:out[1], 2:out[2]};
}
// Dove difende ciascuno, per squadra: zona -> zona "usuale" da cui prende il giocatore.
// Usuale: martello davanti in 4, centrale in 3, opposto/palleggiatore in 2; dietro libero in 5, martello in 6, opp./pal. in 1.
// Decimo: libero in 6 e martello in 5 (la pipe la attacca comunque il martello di seconda linea).
const DEF_ZONES = [4,3,2,5,6,1];
const defPattern = t => ARR[DATA[t].name]?.def || (t === OUR ? {4:4,3:3,2:2,5:6,6:5,1:1} : {4:4,3:3,2:2,5:5,6:6,1:1});
function layoutRally(t) {
  const b = baseRally(t), d = defPattern(t), z = {};
  for (const k of DEF_ZONES) z[k] = b[d[k]];
  return z;
}
function comboPlayer(t, who) {
  const z = layout(t);
  if (who === 'P') return S.pos[t].find(n => role(t,n) === 'P') ?? null;
  if (who === 'OB') return role(t, z[1]) === 'O' ? z[1] : null;
  if (receivingNow(t)) return arrangement(t).att[who] ?? null;   // chi riceve: come si schiera in quella rotazione
  if (who === 'A4') return z[4];
  if (who === 'A3') return z[3];
  if (who === 'A2') return role(t, z[2]) === 'O' ? z[2] : null;
  if (who === 'AP') return z[6];
  return null;
}
// chi mura (proposta) dalla zona da cui arriva l'attacco
function proposedBlocker(t, comboCode) {
  const z = layoutRally(t);
  if (/^[XV]5$/.test(comboCode)) return z[2];
  if (/^[XV][68]$/.test(comboCode)) return z[4];
  return z[3];
}
// disposizione dei campi come si vedono nel video
const courtRows = t => isFar(t) ? [[1,6,5],[2,3,4]] : [[4,3,2],[5,6,1]];
const frontRow = t => isFar(t) ? [2,3,4] : [4,3,2];
const recOrder = t => isFar(t) ? [2,1,0] : [0,1,2];        // indici dello schieramento [z5, z6, z1]
const REC_ZONES = ['zona 5','zona 6','zona 1'];

// ---------------------------------------------------------------- codici
const two = n => String(n).padStart(2,'0');
function push(t, n, skill, type, grade, extra='', desc='', auto=false) {
  const code = n == null ? `${t}$$${skill}` : `${t}${two(n)}${skill}${type}${grade}${extra}`;
  S.rally.push({t, n, skill, grade, code, desc: desc || `${name(t,n)}`, auto, vt:Math.round(video.currentTime * 10) / 10});
  S.nActs++; if (auto) S.nAuto++;
}
function endRally(winner, why) {
  S.score[winner]++;

// scheda del set successivo dal referto; il palleggiatore che il referto non dice resta quello indicato nel set prima
function nextSetME(ri, set) {

  for (const r of list) {

      const t = m[1], out = Number(m[2]), inn = Number(m[3]), i = S.pos[t].indexOf(out);

    S.score[r.winner]++; r.score = {...S.score};

function doSub(t, out, inn) {

// attacco -> tocco implicito dell'altra squadra (come in Volleyball Scout / DataVolley): B = muro, D = difesa
const LINKS = {'#':{B:'=', D:'='}, '+':{B:'-', D:'-'}, '!':{B:'!'}, '-':{B:'+', D:'+'}, '/':{B:'#'}};
const LINK_DESC = {'B=':'mani fuori', 'D=':'difesa sbagliata', 'B-':'muro (buono per chi attacca)', 'D-':'difesa scarsa',
                   'B!':'muro ripreso da chi attacca', 'B+':'muro positivo', 'D+':'difesa', 'B#':'muro punto'};
const LINK_HEAD = {'#':'punto: a terra, mani fuori o difesa sbagliata?', '+':'attacco + → difesa – o muro – di chi?',
                   '!':'attacco ! → muro ! di chi?', '-':'attacco – → difesa + o muro + di chi?', '/':'murato → muro punto di chi?'};
// zona di partenza dalla sigla (codice DataVolley: sigla, ~, zona di partenza, ~, ~, colpo H forte / T pallonetto)
const START_ZONE = {V5:4, X5:4, X7:3, X1:3, XC:3, X2:3, X6:2, V6:2, XP:8, X8:9, V8:9};
const attackExtra = (combo, tip) => `${combo === 'P2' ? '~~' : combo}~${START_ZONE[combo] ?? '~'}~~${tip ? 'T' : 'H'}`;

// ---------------------------------------------------------------- base del centrale
// Vale solo per il 1° attacco dopo ricezione. Si tocca quando si vuole: durante lo scambio (dopo la ricezione)
// oppure a scambio chiuso, finché non si segna la battuta successiva. Nel .dvw va sulla riga dell'alzata (E…K1).
const recInPlay = acts => acts.find(a => a.skill === 'R' && '#+!-'.includes(a.grade));
function baseTarget() {
  const cur = recInPlay(S.rally);
  if (cur) return {cur:true, team:cur.t, acts:S.rally, base:S.rallyBase, score:S.score};
  const last = S.rallies[0], r = last && recInPlay(last.actions);
  if (r && !S.rally.length) return {cur:false, team:r.t, acts:last.actions, base:last.base, score:last.score};
  return null;
}
function onBase(c) {
  const tg = baseTarget(); if (!tg) return toast('La base va su uno scambio con la ricezione in gioco');
  tap(); snapshot();
  if (tg.cur) S.rallyBase = S.rallyBase === c ? null : c; else S.rallies[0].base = S.rallies[0].base === c ? null : c;
  render();

// inserisce (o completa) la riga dell'alzata con la chiamata prima del 1° attacco dopo ricezione
function withBase(actions, base) {
  const out = [];
  for (const a of actions) {
    if (a.soFirst && a.setter != null && (base || a.implied)) {
      const call = base || a.implied, prev = out[out.length - 1];
      if (prev && prev.skill === 'E' && prev.t === a.t) { prev.code += call; prev.desc += ' · base ' + call; }
      else out.push({t:a.t, skill:'E', code:`${a.t}${two(a.setter)}E${a.btype}~${call}`,
                     desc:`${name(a.t, a.setter)} · base ${call}${base ? '' : ' (dalla sigla)'}`, auto:true});
    }

    : `${tg.cur ? 'scambio in corso' : 'scambio appena chiuso'} · ${DATA[tg.team].name}`;

    <div class="bbtns">${CALLS.map(c => `<button class="bb ${tg && tg.base === c ? 'sel' : ''} ${implied === c ? 'imp' : ''}"

// ---------------------------------------------------------------- azioni dell'utente
// future: i passi annullati, che "Risegna" rimette; un tocco nuovo li cancella
function snapshot() { history.push(clone(S)); if (history.length > 200) history.shift(); future = []; }
function tap() { taps++; if (firstTapAt == null) { firstTapAt = Date.now(); videoAtFirstTap = video.currentTime; } }

function onGrade(g) {
  tap(); const ph = S.phase, sel = S.sel;
  if (ph.k === 'serve') {
    const st = S.serving, rt = other(st), server = S.pos[st][0];
    const type = S.serveType[server] || pl(st,server).sv || 'M';
    if (sel.receiver == null) {
      if (g === '=') { snapshot(); push(st, server, 'S', type, '=', '', `${name(st,server)} · battuta sbagliata`); endRally(rt, 'errore in battuta'); return render(); }
      if (g === '#') { snapshot(); push(st, server, 'S', type, '#', '', `${name(st,server)} · ace`); endRally(st, 'ace'); return render(); }
      return toast('Prima tocca chi riceve (o = per l\'errore in battuta)');
    }
    snapshot();
    push(st, server, 'S', type, SERVE_FROM_REC[g], '', `${name(st,server)} · battuta (dalla ricezione)`, true);
    push(rt, sel.receiver, 'R', type, g, '', `${name(rt,sel.receiver)} · ricezione`);
    if (g === '=') endRally(st, 'ace');
    else if (g === '/') { S.phase = {k:'over', t:st, from:'R'}; S.sel = {}; }     // palla di là: "rigore" o palla libera?
    else { S.phase = {k:'attack', t:rt, so:true}; S.sel = {}; }
    return render();
  }
  if (ph.k === 'attack') {
    const t = ph.t;
    if (!sel.combo) return toast('Prima tocca la sigla dell\'attacco');
    const att = sel.player ?? comboPlayer(t, sel.combo[1]);
    if (att == null) return toast('Nessun giocatore adatto in campo per questa sigla');
    snapshot();
    const setter = S.pos[t].find(x => role(t,x) === 'P');
    // 1° attacco dopo ricezione dello scambio: è quello a cui si aggancia la base del centrale
    const soFirst = receivingNow(t) && !S.rally.some(a => a.skill === 'A' && a.t === t);
    if (sel.fbTeam) push(t, 0, 'F', 'H', sel.fbTeam, '', `palla libera ${DATA[t].name} appoggiata ${sel.fbTeam === '+' ? 'bene' : 'male'} (senza giocatore)`, false);
    if (sel.badSet && !sel.badSetDone && setter != null && setter !== att)
      push(t, setter, 'E', 'H', '/', '', `${name(t,setter)} · alzata negativa`);
    push(t, att, 'A', sel.combo[2], g, attackExtra(sel.combo[0], sel.tip), `${name(t,att)} · ${sel.combo[0]}${sel.tip ? ' · pallonetto' : ''}${sel.badSet ? ' · da alzata negativa' : ''}`);
    if (soFirst) Object.assign(S.rally[S.rally.length - 1], {soFirst:true, setter, btype:sel.combo[2], implied:sel.combo[3] || null});
    if (g === '=') endRally(other(t), 'errore in attacco');
    else if (PREFS.oppLight && (OUR == null || t === OUR) && g !== '/') {
      // avversario essenziale: chi difende o mura per loro non si segna (solo il muro punto).
      // Partita tra avversari: vale per tutte e due le squadre; dopo l'attacco punto niente "a terra / mani fuori" (facoltativo)
      if (g === '#' && OUR == null && !PREFS.neutralHow) endRally(t, 'attacco');
      else if (g === '#') { S.phase = {k:'link', t:other(t), g, type:sel.combo[2], from:sel.combo[0], att:t}; S.sel = {}; }  // a terra, mani fuori o difesa?
      else if (g === '!') { S.phase = {k:'defense', t, type:sel.combo[2]}; S.sel = {}; }   // murata ripresa: palla a noi
      else { S.phase = {k:'attack', t:other(t), afterOur:true}; S.sel = {}; }
    }
    else { S.phase = {k:'link', t:other(t), g, type:sel.combo[2], from:sel.combo[0], att:t}; S.sel = {}; }  // chi ha toccato di là?
    return render();
  }
  if (ph.k === 'defense') {
    const t = ph.t;
    if (sel.player == null) return toast('Prima tocca chi ha toccato la palla');
    snapshot();
    const type = ph.type || 'H';
    if (sel.mode === 'B') {
      push(t, sel.player, 'B', type, g, '', `${name(t,sel.player)} · muro`);
      if (g === '#') endRally(t, 'muro');
      else if (g === '=' || g === '/') endRally(other(t), g === '/' ? 'invasione a muro' : 'mani fuori');
      else if (g === '-') { S.phase = {k:'defense', t:other(t), type}; S.sel = {}; }
      else { S.phase = {k:'defense', t, type}; S.sel = {}; }
    } else {
      const fb = !!sel.freeball || ph.freeball;
      push(t, sel.player, fb ? 'F' : 'D', fb ? 'H' : type, g, '', `${name(t,sel.player)} · ${fb ? 'palla libera' : 'difesa'}`);
      if (g === '=') endRally(other(t), fb ? 'palla libera sbagliata' : 'errore in difesa');
      else if (g === '/') { S.phase = {k:'over', t:other(t), from:'D'}; S.sel = {}; }
      else { S.phase = {k:'attack', t}; S.sel = {}; }
    }
    return render();
  }
  if (ph.k === 'over') {          // voto della palla libera di chi si è trovato la palla di qua
    const t = ph.t;
    if (sel.player == null) return toast('Prima tocca chi ha preso la palla (poi "rigore" o il voto della palla libera)');
    snapshot();
    push(t, sel.player, 'F', 'H', g, '', `${name(t,sel.player)} · palla libera (dopo ${ph.from === 'R' ? 'ricezione' : 'difesa'} / degli altri)`);
    if (g === '=') endRally(other(t), 'palla libera sbagliata');
    else if (g === '/') { S.phase = {k:'over', t:other(t), from:'D'}; S.sel = {}; }
    else { S.phase = {k:'attack', t}; S.sel = {}; }
    return render();
  }
}

const RIGORE_OUT = {'#':['Punto','punto'], '-':['Difeso','difeso'], '=':['Fuori / rete','fuori o in rete'], '/':['Invasione','invasione']};
const rigoreBtns = (dis, cls) => Object.entries(RIGORE_OUT).map(([g, o]) =>
  `<button class="${cls} rg${g === '#' ? ' pos' : g === '-' ? '' : ' neg'}" data-k="rigore" data-v="${g}" ${dis ? 'disabled' : ''}>${o[0]}</button>`).join('');
const SET_LBL = {'-':'imprecisa', '/':'negativa', '=':'sbagliata'};
function onPick(kind, val, extra) {
  tap();
  const ph = S.phase;
  if (kind === 'receiver') S.sel.receiver = S.sel.receiver === val ? null : val;
  if (kind === 'serveType') S.serveType[S.pos[S.serving][0]] = val;
  if (kind === 'serveCycle') { const srv = S.pos[S.serving][0], cur = S.serveType[srv] || pl(S.serving, srv).sv || 'M';
    const i = SERVE_TYPES.findIndex(x => x[0] === cur); S.serveType[srv] = SERVE_TYPES[(i + 1) % SERVE_TYPES.length][0]; }
  if (kind === 'combo') { S.sel.combo = val; S.sel.player = null; S.sel.fromOvl = !!extra; }
  if (kind === 'setErr') { S.phase = {k:'setby', t:ph.t, g:val, back:clone(ph)}; S.sel = {}; }   // chi ha alzato?
  if (kind === 'setbyCancel') { S.phase = ph.back; S.sel = ph.backSel ? {...ph.backSel, badSet:false, badSetDone:false} : {}; }
  if (kind === 'setby') {
    snapshot();
    push(ph.t, val, 'E', 'H', ph.g, '', `${name(ph.t,val)} · alzata ${SET_LBL[ph.g]}`);
    if (ph.g === '=') endRally(other(ph.t), 'alzata sbagliata');
    else { S.phase = ph.back; S.sel = ph.backSel || {}; }      // imprecisa o negativa: l'attacco arriva lo stesso
  }
  // "alzata negativa" (E/, richiesta dell'utente del 2026-11-22): l'attacco che segue nasce da un'alzata che lo mette in
  // difficoltà, così non sembra colpa dell'attaccante. Alza il palleggiatore in campo; se l'ultimo tocco della squadra è
  // suo (ha difeso lui) si chiede chi ha alzato, e si torna all'attacco con la sigla già scelta
  if (kind === 'badSet') {
    const t = ph.t, setter = S.pos[t].find(x => role(t,x) === 'P');
    const lastT = [...S.rally].reverse().find(a => a.t === t && !a.note && a.skill && a.skill !== 'c');
    if (S.sel.badSetDone) { toast('Alzata negativa già segnata: ↶ per toglierla'); }
    else if (!S.sel.badSet && (setter == null || (lastT && lastT.n === setter))) {
      S.phase = {k:'setby', t, g:'/', back:clone(ph), backSel:{...S.sel, badSet:true, badSetDone:true}}; S.sel = {};
    } else S.sel.badSet = !S.sel.badSet;
  }
  if (kind === 'tip') S.sel.tip = !S.sel.tip;
  if (kind === 'switch') {
    if (ph.k === 'attack') S.phase = {k:'defense', t:other(ph.t), type:'H'};
    else if (ph.k === 'defense') S.phase = {...ph, t:other(ph.t)};
    S.sel = {};
  }
  if (kind === 'freeball') S.sel.freeball = !S.sel.freeball;
  // "rigore": la palla rimandata di qua da ricezione o difesa / colpita al volo sopra la rete. Nel .dvw è un muro subito
  // dopo la R/ o D/ degli altri, come chiede la federazione, con il suo esito (decisione dell'utente del 2026-11-22):
  // B# punto, B- difeso dagli altri (si continua con la loro difesa), B= fuori o in rete, B/ invasione.
  // La pipeline lo riconosce come "rigore" (src.dvw._mark_rigori) e non lo conta mai nel muro.
  if (kind === 'rigore') {
    if (S.sel.player == null) { toast('Prima tocca chi ha fatto il "rigore"'); return render(); }
    const t = ph.t, n = S.sel.player, g = val, o = RIGORE_OUT[g];
    snapshot(); push(t, n, 'B', 'H', g, '', `${name(t, n)} · "rigore" ${o[1]}`);
    if (g === '#') endRally(t, '"rigore"');
    else if (g === '-') { S.phase = {k:'defense', t:other(t), type:'H'}; S.sel = {}; }
    else endRally(other(t), `"rigore" ${o[1]}`);
  }
  if (kind === 'overAttack') { S.phase = {k:'attack', t:ph.t, over:true}; S.sel = {}; }   // attaccata con una sigla (al volo dopo l'alzata)
  if (kind === 'player') { S.sel.player = val; S.sel.mode = extra; S.sel.fromOvl = true; }
  if (kind === 'overNoAttack') { // palla rimandata di là senza attacco = palla libera per gli altri
    snapshot();
    if (PREFS.oppLight && other(ph.t) !== OUR) { S.phase = {k:'attack', t:other(ph.t), afterOur:true}; S.sel = {fbTeam:'+'}; }
    else { S.phase = {k:'defense', t:other(ph.t), type:'H', freeball:true}; S.sel = {}; }
  }
  if (kind === 'fbTeam') S.sel.fbTeam = S.sel.fbTeam === val ? null : val;   // '+' appoggiata bene, '-' male
  if (kind === 'link') {          // dopo il voto dell'attacco: chi ha toccato dall'altra parte (voto implicito)
    snapshot();
    const o = ph.t, at = ph.att, g = ph.g, sk = extra;
    if (val != null) { const gr = LINKS[g][sk]; push(o, val, sk, ph.type, gr, '', `${name(o,val)} · ${LINK_DESC[sk + gr]}`, true); }
    if (g === '#') endRally(at, val == null ? 'attacco a terra' : (sk === 'B' ? 'attacco (mani fuori)' : 'attacco (difesa sbagliata)'));
    else if (g === '/') endRally(o, 'muro');
    else if (g === '!') { S.phase = {k:'defense', t:at, type:ph.type}; S.sel = {}; }        // palla tornata a chi attacca
    else if (sk === 'B') { S.phase = {k:'defense', t:o, type:ph.type}; S.sel = {}; }       // muro + / -: gioca chi ha murato
    else { S.phase = {k:'attack', t:o}; S.sel = {}; }                                       // difesa + / -: contrattacco
  }
  render();
}

// ---------------------------------------------------------------- eventi del pannello
// Pulsanti sul video: si attivano al tocco (pointerdown), senza aspettare il "click". Con YouTube il primo tocco dopo
// aver usato il lettore va al riquadro di YouTube e il click non arriva: si perdeva un tocco.
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('#ovl button, #subBanner button, #fsbar button[data-base]'); if (!b || b.disabled || b.closest('.calpanel, .calmini')) return;
  if (!(b.dataset.g || b.dataset.k || b.dataset.base)) return;
  e.preventDefault(); ovlDownAt = performance.now(); handleBtn(b);
}, true);
let ovlDownAt = 0;
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  // il click che segue il tocco (anche su un pulsante ridisegnato nello stesso punto) non deve rifare l'azione
  if (b.closest('#ovl, #subBanner, #fsbar') && performance.now() - ovlDownAt < 1200) return;
  handleBtn(b);
});
function handleBtn(b) {
  if (b.closest('.modal') || b.closest('#tut') || b.closest('.calbar') || b.closest('.calpanel')) return;
  if (b.dataset.base) return onBase(b.dataset.base);
  if (b.dataset.g) return onGrade(b.dataset.g);
  if (b.dataset.k) {
    const k = b.dataset.k, v = b.dataset.v;
    if (k === 'combo') return onPick('combo', ALL_COMBOS.find(c => c[0] === v), b.dataset.ovl);
    if (k === 'link') return onPick('link', v === '' ? null : Number(v), b.dataset.x);
    return onPick(k, ['receiver','player','setby'].includes(k) ? Number(v) : v, b.dataset.ovl ? (b.dataset.x || '') : b.dataset.x);
  }
}

async function afterVideoChange() {
  const vk = videoKey(), want = resumeWanted; resumeWanted = null;
  if (want) return restoreScout(want);
  let rec = null; try { rec = await scoutGet(vk); } catch (e) {}
  if (rec && hasWork(rec.S)) {
    const n = rec.S.rallies.length;
    if (confirm(`Per questo video c'è uno scout salvato: ${rec.title}${rec.set ? `, ${rec.set}° set` : ''}, ${rec.S.score['*']}-${rec.S.score.a}, ${n} scambi (${when(rec.updated)}).\n\nOK = lo riprendo · Annulla = ricomincio da capo (quello salvato resta nell'elenco come copia)`))
      return restoreScout(rec);
    rec.key = `${vk}@${rec.updated}`; rec.title += ' (copia)';
    try { await scoutPut(rec); await scoutDel(vk); } catch (e) {}
  }
  SCOUT_KEY = vk;
  matchForVideo();
}
// scout salvati prima del conteggio dei set (2026-11-22): il set di ogni scambio si ricava dal punteggio, che riparte
// da capo a ogni "Nuovo set" fatto dalla scheda della partita
function migrateSets(st) {
  if (!st || st.sets) return 0;
  const chron = [...(st.rallies || [])].reverse(), sets = [], tot = sc => sc['*'] + sc.a;
  let n = 1, prev = null;
  for (const r of chron) {
    if (prev && tot(r.score) <= tot(prev.score) - 1 && tot(r.score) <= 2) { sets.push({n, score:{...prev.score}}); n++; }
    r.set = n; prev = r;
  }
  if (prev && tot(st.score) < tot(prev.score)) { sets.push({n, score:{...prev.score}}); n++; }   // "Nuovo set" appena fatto, 0-0
  st.sets = sets; st.setNo = n;
  return sets.length;
}
function restoreScout(rec) {
  const vk = videoKey();
  if (rec.match) { MATCHES[vk] = rec.match; save('scoutMockupMatches', MATCHES); applyMatch(rec.match); }
  S = rec.S; history = rec.history || []; future = []; const migrated = migrateSets(S); taps = rec.taps || 0; firstTapAt = null; SCOUT_KEY = rec.key; lastCreated[rec.key] = rec.created;
  $('matchModal').classList.add('hidden'); ME = null;
  const at = resumeAt(rec); resumeVt = at;
  if (YTP) pendingSeek = at; else if (videoEl.readyState >= 1) videoEl.currentTime = at; else pendingSeek = at;
  video.pause(); render();
  toast(`Scout ripreso: ${S.setNo || 1}° set, ${S.score['*']}-${S.score.a}, ${S.rallies.length} scambi${migrated ? ` · set chiusi: ${S.sets.map(x => x.score['*'] + '-' + x.score.a).join(', ')}` : ''} · video a ${mmssv(at)}`, '#1d4d2c');
}

$('importIn').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    let d; try { d = JSON.parse(r.result); } catch (err) { return toast('Il file non è una copia di sicurezza dello scout'); }
    if (!d || d.app !== 'volley-scout') return toast('Il file non è una copia di sicurezza dello scout');
    // preferenze e dizionari (tarature, partite, schieramenti, palleggiatori): unione, vince la copia importata
    for (const [k, v] of Object.entries(d.localStorage || {})) {
      if (!LS_KEYS.includes(k)) continue;
      let cur = null, imp = null; try { cur = JSON.parse(localStorage.getItem(k)); imp = JSON.parse(v); } catch (err) {}
      const val = cur && imp && typeof cur === 'object' && typeof imp === 'object' ? JSON.stringify({...cur, ...imp}) : v;
      try { localStorage.setItem(k, val); } catch (err) {}
    }
    // scout: si tiene il più recente tra quello già qui e quello della copia
    await saveNow();
    let added = 0, kept = 0;
    for (const sc of d.scouts || []) {
      const here = await scoutGet(sc.key).catch(() => null);
      if (here && here.updated >= sc.updated) { kept++; continue; }
      await scoutPut(sc); added++;
    }
    alert(`Copia importata: ${added} scout${kept ? `, ${kept} lasciati com'erano (quelli qui erano più recenti)` : ''}, più tarature, partite e preferenze. L'app si ricarica.`);
    location.reload();
  };

});
// file da salvare: su iPad il foglio di condivisione (Salva su File, AirDrop...), altrove lo scaricamento
async function shareFile(fname, text, type) {
  const file = new File([text], fname, {type});
  if (IOS && navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title:fname}); return; } catch (err) { if (err && err.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = fname;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
